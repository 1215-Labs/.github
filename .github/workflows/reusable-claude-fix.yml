name: Reusable Claude Code Fix

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'The issue or PR number'
        required: true
        type: number
      comment_user:
        description: 'The user who triggered the workflow'
        required: true
        type: string
      repository:
        description: 'The repository (owner/repo)'
        required: true
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load fix instructions
        id: load-instructions
        run: |
          ISSUE_NUMBER="${{ inputs.issue_number }}"

          # Try local first (allows customization)
          if [ -f ".github/issue_fix_prompt.md" ]; then
            TEMPLATE_PATH=".github/issue_fix_prompt.md"
            echo "Using local template at .github/issue_fix_prompt.md"
          elif [ -f "issue_fix_prompt.md" ]; then
            TEMPLATE_PATH="issue_fix_prompt.md"
            echo "Using local template at issue_fix_prompt.md"
          else
            # Fallback to canonical template from source repo
            echo "No local template found. Fetching canonical template from 1215-Labs/.github..."
            curl -fsSL https://raw.githubusercontent.com/1215-Labs/.github/main/.github/issue_fix_prompt.md \
              -o /tmp/issue_fix_prompt.md
            TEMPLATE_PATH="/tmp/issue_fix_prompt.md"
            echo "Using remote template"
          fi

          # Verify template was loaded successfully
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "Failed to load template from local or remote source"
            exit 1
          fi

          # Read the template and replace the AI_ASSISTANT placeholder
          INSTRUCTIONS=$(cat "$TEMPLATE_PATH" | sed 's/{AI_ASSISTANT}/claude/g')

          # Use heredoc to preserve multiline content with context prepended
          echo "CUSTOM_INSTRUCTIONS<<EOF" >> $GITHUB_OUTPUT
          echo "# GitHub Context" >> $GITHUB_OUTPUT
          echo "- Repository: ${{ inputs.repository }}" >> $GITHUB_OUTPUT
          echo "- Issue/PR Number: ${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          echo "- Triggered by: ${{ inputs.comment_user }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$INSTRUCTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Claude Code Fix
        id: claude
        uses: anthropics/claude-code-action@beta
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-fix"
          custom_instructions: ${{ steps.load-instructions.outputs.CUSTOM_INSTRUCTIONS }}
