name: Reusable Codex Fix

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'The issue or PR number'
        required: true
        type: number
      comment_user:
        description: 'The user who triggered the workflow'
        required: true
        type: string
      repository:
        description: 'The repository (owner/repo)'
        required: true
        type: string
      event_name:
        description: 'The event name (issue_comment or pull_request_review_comment)'
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      WORKFLOW_SYNC_PAT:
        required: false
        description: 'PAT with workflows permission for pushing changes to workflow files'

jobs:
  codex-fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch if applicable
        id: checkout-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if this is a PR by trying to get PR details
          if gh pr view ${{ inputs.issue_number }} --json headRefName,baseRefName -q '.headRefName' 2>/dev/null; then
            HEAD_REF=$(gh pr view ${{ inputs.issue_number }} --json headRefName -q '.headRefName')
            BASE_REF=$(gh pr view ${{ inputs.issue_number }} --json baseRefName -q '.baseRefName')
            echo "This is a PR - checking out branch: $HEAD_REF"
            gh pr checkout ${{ inputs.issue_number }}
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
            echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          else
            echo "This is an issue, staying on default branch"
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch issue/PR details
        id: fetch-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the issue or PR details using GitHub CLI
          if [ "${{ inputs.event_name }}" == "issue_comment" ]; then
            gh issue view ${{ inputs.issue_number }} --json title,body,comments --jq '{title,body,comments: [.comments[] | {author: .author.login, body: .body}]}' > /tmp/issue-details.json 2>/dev/null || \
            gh pr view ${{ inputs.issue_number }} --json title,body,comments --jq '{title,body,comments: [.comments[] | {author: .author.login, body: .body}]}' > /tmp/issue-details.json
          else
            gh pr view ${{ inputs.issue_number }} --json title,body,comments --jq '{title,body,comments: [.comments[] | {author: .author.login, body: .body}]}' > /tmp/issue-details.json
          fi

      - name: Prepare fix instructions
        run: |
          # Try local first (allows customization)
          if [ -f ".github/issue_fix_prompt.md" ]; then
            TEMPLATE_PATH=".github/issue_fix_prompt.md"
            echo "Using local template at .github/issue_fix_prompt.md"
          elif [ -f "issue_fix_prompt.md" ]; then
            TEMPLATE_PATH="issue_fix_prompt.md"
            echo "Using local template at issue_fix_prompt.md"
          else
            # Fallback to canonical template from source repo
            echo "No local template found. Fetching canonical template from 1215-Labs/.github..."
            curl -fsSL https://raw.githubusercontent.com/1215-Labs/.github/main/.github/issue_fix_prompt.md \
              -o /tmp/issue_fix_prompt.md
            TEMPLATE_PATH="/tmp/issue_fix_prompt.md"
            echo "Using remote template"
          fi

          # Verify template was loaded successfully
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "Failed to load template from local or remote source"
            exit 1
          fi

          INSTRUCTIONS=$(cat "$TEMPLATE_PATH" | sed 's/{AI_ASSISTANT}/codex/g')

          # Read issue/PR details
          ISSUE_DETAILS=$(cat /tmp/issue-details.json)

          # Prepend context with full issue details
          echo "# GitHub Context" > /tmp/codex-fix-prompt.md
          echo "- Repository: ${{ inputs.repository }}" >> /tmp/codex-fix-prompt.md
          echo "- Issue/PR Number: ${{ inputs.issue_number }}" >> /tmp/codex-fix-prompt.md
          echo "- Triggered by: ${{ inputs.comment_user }}" >> /tmp/codex-fix-prompt.md
          echo "" >> /tmp/codex-fix-prompt.md
          echo "## Issue/PR Details" >> /tmp/codex-fix-prompt.md
          echo '```json' >> /tmp/codex-fix-prompt.md
          echo "$ISSUE_DETAILS" >> /tmp/codex-fix-prompt.md
          echo '```' >> /tmp/codex-fix-prompt.md
          echo "" >> /tmp/codex-fix-prompt.md
          echo "$INSTRUCTIONS" >> /tmp/codex-fix-prompt.md

      - name: Run Codex Fix
        id: codex
        uses: openai/codex-action@v1
        timeout-minutes: 30
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/codex-fix-prompt.md
          output-file: codex-output.md
          sandbox: workspace-write

      - name: Prepare PR body
        if: success()
        run: |
          # Create PR body with Codex output
          echo "## Automated Fix by Codex" > /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "This PR was automatically generated by Codex in response to issue #${{ inputs.issue_number }}." >> /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md

          # Include Codex output if it exists
          if [ -f codex-output.md ]; then
            echo "## Codex Analysis" >> /tmp/pr-body.md
            echo "" >> /tmp/pr-body.md
            cat codex-output.md >> /tmp/pr-body.md
            echo "" >> /tmp/pr-body.md
          fi

          echo "---" >> /tmp/pr-body.md
          echo "*Fixed by Codex*" >> /tmp/pr-body.md

      - name: Push fixes to PR branch
        if: success() && steps.checkout-pr.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.WORKFLOW_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Clear the extraheader set by actions/checkout (uses GITHUB_TOKEN, can't push workflow files)
          git config --local --unset-all http.https://github.com/.extraheader || true

          # Configure git to use PAT for push (required for workflow file changes)
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ inputs.repository }}.git"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            git add -A
            git commit -m "fix: apply Codex suggestions"
            git push
            echo "has_changes=true" >> $GITHUB_ENV
            echo "Pushed fixes to PR branch"
          fi

      - name: Create pull request with fixes (for issues)
        if: success() && steps.checkout-pr.outputs.is_pr != 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "fix: resolve issue via Codex"
          branch: fix/issue-${{ inputs.issue_number }}-codex
          title: "Fix: Automated fix via Codex"
          body-path: /tmp/pr-body.md

      - name: Comment on PR with results
        if: success() && steps.checkout-pr.outputs.is_pr == 'true'
        uses: actions/github-script@v9
        env:
          HAS_CHANGES: ${{ env.has_changes }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = ${{ inputs.issue_number }};
            const hasChanges = process.env.HAS_CHANGES === 'true';

            let body;
            if (hasChanges) {
              body = '✅ Codex has pushed fixes to this PR.\n\n';
              if (fs.existsSync('codex-output.md')) {
                body += '## Codex Analysis\n\n' + fs.readFileSync('codex-output.md', 'utf8');
              }
            } else {
              body = '⚠️ Codex analyzed the code but made no changes.\n\n';
              if (fs.existsSync('codex-output.md')) {
                body += '## Codex Analysis\n\n' + fs.readFileSync('codex-output.md', 'utf8');
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Comment on issue with new PR
        if: steps.create-pr.outputs.pull-request-number
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ inputs.issue_number }};
            const prNumber = ${{ steps.create-pr.outputs.pull-request-number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Codex created PR #${prNumber} to fix this issue`
            });
