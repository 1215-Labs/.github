name: Cursor Fix (Write Access)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  # JSON array of GitHub usernames allowed to trigger AI workflows in this repo.
  # Prefer setting a repository OR organization variable AI_WORKFLOW_AUTHORIZED_USERS_JSON
  # (Repo: Settings → Secrets and variables → Actions → Variables)
  # Example: ["mdc159"] or ["mdc159","teammate1"]
  AI_WORKFLOW_AUTHORIZED_USERS_JSON: ${{ vars.AI_WORKFLOW_AUTHORIZED_USERS_JSON || '[]' }}

jobs:
  cursor-fix:
    # Only trigger on @cursor-fix command from authorized users
    if: |
      (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@cursor-fix') &&
      contains(fromJSON((startsWith(vars.AI_WORKFLOW_AUTHORIZED_USERS_JSON, '[') && vars.AI_WORKFLOW_AUTHORIZED_USERS_JSON) || '[]'), github.event.comment.user.login)

    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow creating branches and editing files
      pull-requests: write # Allow creating and updating pull requests
      issues: write # Allow commenting on and updating issues
      id-token: write # Required for OIDC authentication
      actions: read # Read CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for better context

      - name: Configure Git
        run: |
          git config user.name "cursor-bot"
          git config user.email "cursor-bot@users.noreply.github.com"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Load fix instructions
        id: load-instructions
        run: |
          # Get the issue or PR number from the event
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          else
            ISSUE_NUMBER="${{ github.event.pull_request.number }}"
          fi

          # Try local first (allows customization)
          if [ -f ".github/issue_fix_prompt.md" ]; then
            TEMPLATE_PATH=".github/issue_fix_prompt.md"
            echo "✓ Using local template at .github/issue_fix_prompt.md"
          elif [ -f "issue_fix_prompt.md" ]; then
            TEMPLATE_PATH="issue_fix_prompt.md"
            echo "✓ Using local template at issue_fix_prompt.md"
          else
            # Fallback to canonical template from source repo
            echo "📋 No local template found. Fetching canonical template from 1215-Labs/.github..."
            echo "💡 To customize: copy to your repo at .github/issue_fix_prompt.md"
            curl -fsSL https://raw.githubusercontent.com/1215-Labs/.github/main/.github/issue_fix_prompt.md \
              -o /tmp/issue_fix_prompt.md
            TEMPLATE_PATH="/tmp/issue_fix_prompt.md"
            echo "✓ Using remote template"
          fi

          # Verify template was loaded successfully
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "❌ Failed to load template from local or remote source"
            exit 1
          fi

          # Read the template and replace placeholders
          INSTRUCTIONS=$(cat "$TEMPLATE_PATH" | sed 's/{AI_ASSISTANT}/cursor/g')

          # Prepend context
          echo "# GitHub Context" > /tmp/cursor_fix_prompt.txt
          echo "- Repository: ${{ github.repository }}" >> /tmp/cursor_fix_prompt.txt
          echo "- Issue/PR Number: ${ISSUE_NUMBER}" >> /tmp/cursor_fix_prompt.txt
          echo "- Triggered by: ${{ github.event.comment.user.login }}" >> /tmp/cursor_fix_prompt.txt
          echo "" >> /tmp/cursor_fix_prompt.txt
          echo "$INSTRUCTIONS" >> /tmp/cursor_fix_prompt.txt

      - name: Run Cursor Fix
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run cursor-agent with the fix instructions and full write permissions
          cursor-agent -p "$(cat /tmp/cursor_fix_prompt.txt)" --model gpt-5.2 --force

  unauthorized-message:
    # Post message for unauthorized users
    if: |
      (
        github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@cursor-fix') &&
      !contains(fromJSON((startsWith(vars.AI_WORKFLOW_AUTHORIZED_USERS_JSON, '[') && vars.AI_WORKFLOW_AUTHORIZED_USERS_JSON) || '[]'), github.event.comment.user.login)

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post unauthorized message
        uses: actions/github-script@v7
        with:
          script: |
            const comment = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ @${context.actor} - You are not authorized to trigger Cursor fixes.\n\nOnly maintainers can trigger Cursor: Please ask a maintainer to run the fix command.`
            };

            if (context.eventName === 'issue_comment') {
              await github.rest.issues.createComment({
                ...comment,
                issue_number: context.issue.number
              });
            } else if (context.eventName === 'pull_request_review_comment') {
              await github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                comment_id: context.payload.comment.id,
                body: comment.body
              });
            }
