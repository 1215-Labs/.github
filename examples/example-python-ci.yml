# Example Python CI Workflow
#
# This example demonstrates how to use the 1215-Labs reusable CI workflow
# for a Python project with pytest, coverage, and linting.
#
# Copy this file to your repository: .github/workflows/ci.yml

name: Python CI

# Trigger the workflow on pushes and pull requests to main branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs of the same workflow
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single Python version
  ci:
    name: CI (Python 3.11)
    uses: 1215-Labs/.github/.github/workflows/reusable-ci.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      run-tests: true
      run-lint: true
      working-directory: '.'

  # Matrix testing across multiple Python versions
  ci-matrix:
    name: CI (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest]
    uses: 1215-Labs/.github/.github/workflows/reusable-ci.yml@main
    with:
      language: 'python'
      python-version: ${{ matrix.python-version }}
      run-tests: true
      run-lint: true
      working-directory: '.'

  # Monorepo example - test multiple packages
  ci-api:
    name: CI API
    uses: 1215-Labs/.github/.github/workflows/reusable-ci.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      run-tests: true
      run-lint: true
      working-directory: './api'

  ci-workers:
    name: CI Workers
    uses: 1215-Labs/.github/.github/workflows/reusable-ci.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      run-tests: true
      run-lint: true
      working-directory: './workers'

  # Using composite action directly (alternative approach)
  custom-ci:
    name: Custom CI Workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Setup Python environment
        uses: 1215-Labs/.github/.github/actions/setup-python-environment@main
        with:
          python-version: '3.11'
          working-directory: '.'
          install-dev-dependencies: true
      
      - name: Run type checking
        run: mypy src/
      
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html
      
      - name: Check code formatting
        run: black --check .
      
      - name: Run security checks
        run: bandit -r src/
      
      - name: Build package
        run: python -m build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
