name: Node.js CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    name: Build and Test
    uses: 1215-Labs/.github/.github/workflows/reusable-ci.yml@main
    with:
      language: 'nodejs'
      node-version: '18'  # Change to your preferred Node.js version
      run-tests: true
      run-lint: true
      working-directory: '.'  # Change if your code is in a subdirectory
