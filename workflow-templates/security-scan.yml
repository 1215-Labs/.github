name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security:
    name: Security Analysis
    uses: 1215-Labs/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      language: 'javascript'  # Change to your primary language
      severity-threshold: 'high'  # Options: critical, high, medium, low
